[project]
name = "amend"
version = "0.1.0"
description = "AMEND: AMEND and AMEND@0: LLM-judge minimum-edit metric for dictation tools"
readme = "README.md"
authors = [
    { name = "manasdhir976", email = "manas@joshtalks.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.6.0",
    "jiwer>=4.0.0",
    "pandas>=3.1.1",
]

[project.scripts]
amend = "amend.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
